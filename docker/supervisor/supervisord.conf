; Process manager for the `app` container (roadmap Phase 8 / spec Section 23).
;
; Before this, the container ran php-fpm as PID 1 and nothing else, which
; is why Phase 5 deliberately left the notification classes *not* queued:
; anything pushed onto Redis would have sat there undelivered, including
; the database-channel rows the customer's Notifications tab reads.
;
; Three processes, one container:
;   php-fpm    — serves nginx, as before
;   queue      — drains the Redis queue (order mail, notifications)
;   scheduler  — runs Laravel's scheduler (activitylog retention)
;
; Deliberately one container rather than three services: the queue worker
; and scheduler need the identical code, .env, and storage/ that php-fpm
; has, and this project ships a bind-mounted single-node compose stack,
; not an orchestrator. Splitting them would mean three copies of the same
; volume and environment block kept in sync by hand.

; Runs unprivileged as www-data (the image's USER), so no program below
; declares a `user=` — supervisord cannot setuid without root, and the
; container deliberately stays non-root so bind-mounted files keep the
; host user's ownership.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --max-time recycles the worker hourly so a long-lived process cannot
; accumulate leaked memory or hold a stale copy of booted config; the
; supervisor restarts it immediately. --tries=3 with a backoff gives a
; transient SMTP failure two more chances before the job is marked failed
; rather than dropping a customer's order confirmation on one blip.
[program:queue]
command=php /var/www/html/artisan queue:work redis --queue=default --sleep=3 --tries=3 --backoff=10 --max-time=3600 --max-jobs=1000
autostart=true
autorestart=true
stopwaitsecs=3600
priority=20
numprocs=2
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; `schedule:work` rather than a cron entry: it is the supported way to run
; the scheduler inside a container, and it keeps the schedule definition
; in routes/console.php where it can be read and tested, instead of split
; between the repo and a crontab nobody looks at.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
