server {
    listen 80;
    server_name localhost;

    # Laravel's public/ is the webroot; adjust if the app isn't scaffolded
    # at the repo root yet.
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 64M;

    access_log /var/log/nginx/waqar-access.log;
    error_log  /var/log/nginx/waqar-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Block access to dotfiles (.env, .git, etc.) except .well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }
}
