server {
    listen 80;
    server_name localhost;

    # Laravel's public/ is the webroot; adjust if the app isn't scaffolded
    # at the repo root yet.
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 64M;

    access_log /var/log/nginx/waqar-access.log;
    error_log  /var/log/nginx/waqar-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Resolved per-request through Docker's embedded DNS rather than
        # once at startup. nginx caches a literal upstream hostname's IP
        # when it boots, so recreating the `app` container (any rebuild or
        # redeploy) left nginx pointing at the old address and every page
        # returned 502 until nginx itself was restarted — a fault that
        # looks like a broken application rather than stale DNS.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # laravel-brain serves its graph payloads from dot-prefixed URLs, which the
    # dotfile deny below would otherwise reject with a 403. Regex locations match
    # in file order, so this has to sit above it. Nothing is read from disk here —
    # the controller builds the JSON.
    location ~ ^/_laravel-brain/.graph-[a-z0-9_-]+.json$ {
        try_files $uri /index.php?$query_string;
    }

    # Block access to dotfiles (.env, .git, etc.) except .well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        # This regex location outranks `location /`, so without a fallback
        # every .css/.js/.png URL that Laravel generates rather than keeps on
        # disk — the laravel-brain UI's own bundle, for one — was served
        # straight from the webroot and 404'd. Real files still hit disk.
        try_files $uri /index.php?$query_string;
    }
}
