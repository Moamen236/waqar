# Host-level reverse proxy — install at /etc/nginx/sites-available/waqar on the HOST
# Then: ln -s /etc/nginx/sites-available/waqar /etc/nginx/sites-enabled/
# Test: nginx -t && systemctl reload nginx

# --- Production: waqarwear.com ---
server {
    listen 80;
    listen [::]:80;
    server_name waqarwear.com www.waqarwear.com;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name waqarwear.com www.waqarwear.com;

    # SSL certs (Let's Encrypt paths — adjust if using different paths)
    ssl_certificate /etc/letsencrypt/live/waqarwear.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waqarwear.com/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 64M;

    # Proxy to production nginx container (port 26991)
    location / {
        proxy_pass http://127.0.0.1:26991;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

