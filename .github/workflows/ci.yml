name: CI

# Every gate this project has, in the order that fails cheapest first.
#
# Phase 7's handover asked for three things to run here specifically:
# the Pest suite, `tools/check-translations.py`, and an **admin render
# check** — because twice now (Phase 6's Arabic tofu, Phase 7's blank
# admin screens) a systemically broken UI passed every backend gate.
# Static analysis cannot see a page that renders nothing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static analysis & style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, exif, pcntl, bcmath, gd, zip, intl, redis
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint (code style)
        run: ./vendor/bin/pint --test

      - name: Larastan (level 5)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: TypeScript
        run: ./node_modules/.bin/tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      # Cheapest guard the project has against a screen shipping raw key
      # names: exits non-zero the moment a `t('…')` has no catalog entry.
      - name: Translation catalogs complete
        run: python3 tools/check-translations.py

  tests:
    name: Pest
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: waqar_testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, exif, pcntl, bcmath, gd, zip, intl, redis
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          # waqar:preflight asserts public/storage resolves — product
          # images are served through it — and Phase8CutoverTest runs
          # that command. Nothing else in the suite needs the link, but
          # without it that one test fails on a real deployment gap.
          php artisan storage:link

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Feature tests render the real Blade root views, and both of them
      # call `@vite(...)`, which reads public/build/manifest.json. Without
      # a build that helper throws "Vite manifest not found" and every
      # test that renders a page fails — 51 of them, which is what this
      # job did on every run before this step existed. The render job
      # builds the same assets (inside the compose container); this is
      # the runner-side equivalent.
      - name: Build assets
        run: npm run build

      # The suite pins itself to `waqar_testing` in tests/TestCase.php
      # rather than phpunit.xml — see that file for why (container env
      # beats phpunit's <env>, which once made the suite drop the
      # development database on every run).
      - name: Run Pest
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: waqar_testing
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_TEST_DATABASE: waqar_testing
          REDIS_HOST: 127.0.0.1
          MAIL_MAILER: array
        run: ./vendor/bin/pest

  render:
    name: Admin render check
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      # Boots the real compose stack — the same one a deploy runs — so
      # this exercises nginx, php-fpm, supervisord and the queue workers
      # together, not a stubbed subset.
      - name: Build and start the stack
        run: |
          cp .env.example .env

          # The compose file bind-mounts the repo over /var/www/html, so
          # the container sees exactly what the runner checked out — not
          # the image's own copy — and the app runs as www-data (uid 82),
          # which owns nothing on the runner. Locally the repo already
          # carries the loose modes CLAUDE.md describes; a fresh checkout
          # does not, so php-fpm could not even write storage/logs.
          chmod -R a+rwX .

          docker compose up -d --build

          # Same bind mount, second consequence: a fresh checkout has no
          # vendor/ and no node_modules/, and neither is in the image
          # (the Dockerfile never runs composer install). Without this,
          # every artisan call below dies on a missing vendor/autoload.php
          # — which is exactly how this job failed the first time it ever
          # got to run. HOME points at /tmp because www-data's home inside
          # the image is root-owned, so composer and npm cannot cache there.
          docker compose exec -T -e HOME=/tmp app \
            composer install --no-interaction --prefer-dist --no-progress
          docker compose exec -T -e HOME=/tmp app npm ci

          docker compose exec -T app php artisan key:generate
          docker compose exec -T app php artisan migrate --force --seed
          docker compose exec -T -e HOME=/tmp app npm run build
          docker compose exec -T app php artisan storage:link || true

          # supervisord started php-fpm, both queue workers and the
          # scheduler before vendor/ existed, so everything but php-fpm
          # exhausted its retries and sat in FATAL. Preflight round-trips
          # a real job through the queue, so it needs them actually alive.
          docker compose restart app

          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L http://localhost:26991/ar || true)
            [ "$code" = "200" ] && break
            sleep 2
          done

      # The cutover checklist, executable. Fails the build if this
      # deployment could not take a real order.
      - name: Preflight
        run: docker compose exec -T app php artisan waqar:preflight

      - name: Storefront responds
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -L http://localhost:26991/ar)
          test "$code" = "200" || { echo "storefront returned $code"; exit 1; }

      # The actual reason this job exists. A blank admin page returns 200
      # with correct props and clean types — only executing the bundle
      # sees it. See tools/render-check.js.
      - name: Seed a known admin password
        run: |
          docker compose exec -T app php artisan tinker --execute="
            App\Models\Employee::role('Super Admin')->first()->update(['password' => 'ci-render-check']);
          "

      # Chromium runs in the compose network so it can reach nginx, with
      # CDP published to the runner — the harness itself then runs on the
      # runner's own Node, which is why it carries no npm dependencies.
      - name: Start headless Chromium
        run: |
          docker run -d --name chromium --network waqar_waqar -p 9222:9222 \
            zenika/alpine-chrome:latest \
            --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9222 --remote-debugging-address=0.0.0.0 \
            --remote-allow-origins='*' \
            --host-resolver-rules="MAP localhost:26991 nginx:80"
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:9222/json/version >/dev/null && break
            sleep 1
          done

      - name: Every admin page renders
        run: |
          docker compose exec -T app php artisan waqar:admin-routes > routes.txt
          EMAIL=$(docker compose exec -T app php artisan tinker --execute="
            echo App\Models\Employee::role('Super Admin')->value('email');
          " | tail -1 | tr -d '\r')
          node tools/render-check.js \
            --base http://localhost:26991 \
            --cdp http://127.0.0.1:9222 \
            --email "$EMAIL" \
            --password ci-render-check \
            --routes routes.txt

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200
