name: waqar

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: waqar_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-waqar}
      DB_USERNAME: ${DB_USERNAME:-waqar}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - waqar

  nginx:
    image: nginx:1.27-alpine
    container_name: waqar_nginx
    restart: unless-stopped
    ports:
      - "26991:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - waqar

  mysql:
    image: mysql:8.0
    container_name: waqar_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-waqar}
      MYSQL_USER: ${DB_USERNAME:-waqar}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - waqar_mysql_data:/var/lib/mysql
      # Creates the separate `waqar_testing` database the Pest suite uses
      # (tests/TestCase.php), on first boot of a fresh volume only.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # MySQL's first boot on a fresh volume takes ~90s to initialise, and
      # before this the app container would start immediately and every
      # `artisan migrate` in that window failed with "Connection refused"
      # — which reads like a broken stack rather than a slow one.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    networks:
      - waqar
    # Not exposed to the host on purpose — only reachable by app/phpMyAdmin
    # on the internal "waqar" network. Use phpMyAdmin (port 32231) or
    # `docker compose exec mysql mysql -u root -p` to reach it directly.

  redis:
    image: redis:7-alpine
    container_name: waqar_redis
    restart: unless-stopped
    volumes:
      - waqar_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - waqar
    # Cache, queue, and session driver (Section 23) — internal only, same
    # "not exposed to the host" rule as mysql.

  # Development SMTP sink. The point is not convenience: without it the
  # local stack would use MAIL_MAILER=log and the *SMTP transport itself*
  # — the thing Phase 8 is supposed to deliver — would never run until
  # production. Here mail goes over real SMTP to a catcher with a web UI.
  # Production points the same MAIL_* variables at the business's own
  # server; no application code changes.
  mailpit:
    image: axllent/mailpit:latest
    container_name: waqar_mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      # Web UI only. The SMTP port (1025) stays internal to the network.
      - "32232:8025"
    networks:
      - waqar

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: waqar_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "32231:80"
    depends_on:
      - mysql
    networks:
      - waqar

networks:
  waqar:
    driver: bridge

volumes:
  waqar_mysql_data:
    driver: local
  waqar_redis_data:
    driver: local
